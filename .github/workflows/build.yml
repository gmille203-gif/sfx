name: Build ViPER Glass APK

on:
  push:
    branches: [ "arena/be9a7481-sfx", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute for gradlew
        run: chmod +x viper-glass/gradlew || echo "no wrapper yet"

      - name: Build Debug APK
        working-directory: viper-glass
        run: |
          # Generate wrapper if missing
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.6
          fi
          ./gradlew :app:assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        working-directory: viper-glass
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SFX-Glass-Debug-APK
          path: viper-glass/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SFX-Glass-Release-APK
          path: viper-glass/app/build/outputs/apk/release/*.apk

  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Magisk Module ZIP
        run: |
          cd module
          zip -r9 ../SFX-Glass-Universal-Module-v3.0.zip * -x "*.git*"
          ls -lh ../*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SFX-Glass-Universal-Module
          path: SFX-Glass-Universal-Module-v3.0.zip
